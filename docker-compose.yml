version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: numbskull_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: numbskull
      POSTGRES_PASSWORD: numbskull_dev
      POSTGRES_DB: numbskull
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U numbskull']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: numbskull_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
